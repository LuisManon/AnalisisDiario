name: Prepare lottery portfolios

on:
  schedule:
    # Dominican time (UTC-4): 14 runs/day, independent of browser visits.
    - cron: "37 12 * * *" # 08:37: refresh and prepare all products
    - cron: "37 14 * * *" # 10:37: preparation retry and verification
    - cron: "17 16 * * *" # 12:17: Quinielon Dia, attempt 1
    - cron: "47 16 * * *" # 12:47: attempt 2
    - cron: "17 17 * * *" # 13:17: final attempt
    - cron: "37 17 * * *" # 13:37: prepare Quinielon Noche early
    - cron: "37 19 * * *" # 15:37: preparation retry
    - cron: "37 21 * * *" # 17:37: final preparation retry
    - cron: "17 23 * * *" # 19:17: Quinielon Noche, attempt 1
    - cron: "47 23 * * *" # 19:47: attempt 2
    - cron: "17 0 * * *"  # 20:17: final attempt (next UTC date)
    # Mon-Sat at 21:17 / 21:47 / 22:17 DR => Tue-Sun UTC.
    - cron: "17 1 * * 0,2-6"
    - cron: "47 1 * * 0,2-6"
    - cron: "17 2 * * 0,2-6"
    # Sunday Kino at 16:17 / 16:47 / 17:17 DR.
    - cron: "17 20 * * 0"
    - cron: "47 20 * * 0"
    - cron: "17 21 * * 0"
  workflow_dispatch:
    inputs:
      schedule:
        description: "Exact cron window to retry; after 6 hours, verify saved records only"
        required: true
        type: string
        default: "37 12 * * *"

permissions:
  contents: write

concurrency:
  group: prepare-lottery-portfolios
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - name: Update and verify scheduled products
        env:
          APP_URL: http://127.0.0.1:3000
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_BRANCH: ${{ github.event.repository.default_branch }}
          AUTOMATION_SCHEDULE: ${{ github.event.schedule || inputs.schedule }}
        run: |
          npm start > /tmp/analisis-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..60}; do
            if curl --silent --fail http://127.0.0.1:3000/api/results > /dev/null; then
              node --experimental-strip-types scripts/automate-portfolios.ts
              exit $?
            fi
            sleep 1
          done
          cat /tmp/analisis-server.log
          exit 1
