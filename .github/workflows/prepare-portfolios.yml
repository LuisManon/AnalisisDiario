name: Prepare lottery portfolios

on:
  schedule:
    # UTC = Dominican time +4. These windows replace the old 48 daily runs.
    - cron: "37 14 * * *" # 10:37 AM: prepare Quinielon Dia
    - cron: "7 16 * * *"  # 12:07 PM: update Dia and prepare daily portfolios
    - cron: "37 21 * * *" # 5:37 PM: prepare Quinielon Noche
    - cron: "7 23 * * *"  # 7:07 PM: update Noche and Loto 5
    - cron: "7 1 * * *"   # 9:07 PM Dominican time on the previous date
    - cron: "7 20 * * 0"  # Sunday 4:07 PM: Kino and Quiniela Pale
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prepare-lottery-portfolios
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Update results and prepare every portfolio
        env:
          APP_URL: https://analisis-diario.vercel.app
        shell: bash
        run: |
          set -u
          failures=0

          call_get() {
            local label="$1"
            local path="$2"
            local retries="${3:-1}"
            echo "::group::${label}"
            if ! curl --fail-with-body --silent --show-error --retry "$retries" --retry-delay 5 --max-time 90 \
              -H "Cache-Control: no-cache" \
              -H "User-Agent: AnalisisDiario-Scheduler/1.0" \
              "${APP_URL}${path}" > /tmp/automation-response.json; then
              failures=$((failures + 1))
            else
              node -e 'const fs=require("fs");const value=JSON.parse(fs.readFileSync("/tmp/automation-response.json","utf8"));console.log(JSON.stringify({ok:value.ok??true,message:value.message??null,targetDate:value.current?.targetDate??null,waitingForResult:value.waitingForResult??false}))'
            fi
            echo "::endgroup::"
          }

          call_post() {
            local label="$1"
            local path="$2"
            local body="$3"
            echo "::group::${label}"
            if ! curl --fail-with-body --silent --show-error --retry 2 --retry-delay 5 --max-time 120 \
              -X POST \
              -H "Cache-Control: no-cache" \
              -H "Content-Type: application/json" \
              -H "User-Agent: AnalisisDiario-Scheduler/1.0" \
              --data "$body" \
              "${APP_URL}${path}" > /tmp/automation-response.json; then
              failures=$((failures + 1))
            else
              node -e 'const fs=require("fs");const value=JSON.parse(fs.readFileSync("/tmp/automation-response.json","utf8"));console.log(JSON.stringify({date:value.date??null,session:value.session??null,error:value.error??null}))'
            fi
            echo "::endgroup::"
          }

          # Select only the products whose draw window is active. Portfolio
          # generators are not retried inside the same run: the next scheduled
          # window can retry without doubling an expensive serverless request.
          dr_hour=$(TZ=America/Santo_Domingo date +%H)
          dr_minute=$(TZ=America/Santo_Domingo date +%M)
          dr_weekday=$(TZ=America/Santo_Domingo date +%u)

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            call_get "Update Loto Mas" "/api/update"
            call_get "Update Super Kino TV" "/api/super-kino/update"
            call_get "Update Quinielon" "/api/la-primera/update?product=quinielon"
            call_get "Update La Primera Loto 5" "/api/la-primera/update?product=loto5"
            call_get "Update Quiniela Pale" "/api/quiniela-pale/update"
            call_post "Prepare Quinielon 2.0 assignment" "/api/quinielon/distributor" '{"session":"auto"}'
            call_get "Prepare Super Kino TV plays" "/api/super-kino/portfolio" 0
            call_get "Prepare Loto Mas plays" "/api/portfolio" 0
            call_get "Prepare La Primera Loto 5 plays" "/api/la-primera/loto5-portfolio" 0
            call_get "Prepare Quiniela Pale plays" "/api/quiniela-pale/portfolio" 0
          elif [[ "$dr_hour" == "10" || "$dr_hour" == "17" ]]; then
            call_post "Prepare Quinielon 2.0 assignment" "/api/quinielon/distributor" '{"session":"auto"}'
          elif [[ "$dr_hour" == "12" ]]; then
            call_get "Update Quinielon Dia" "/api/la-primera/update?product=quinielon"
            call_post "Prepare Quinielon Noche assignment" "/api/quinielon/distributor" '{"session":"auto"}'
            call_get "Prepare Loto Mas plays" "/api/portfolio" 0
          elif [[ "$dr_hour" == "19" ]]; then
            call_get "Update Quinielon Noche" "/api/la-primera/update?product=quinielon"
            call_get "Update La Primera Loto 5" "/api/la-primera/update?product=loto5"
            call_get "Prepare La Primera Loto 5 plays" "/api/la-primera/loto5-portfolio" 0
          elif [[ "$dr_hour" == "21" && "$dr_weekday" != "7" ]]; then
            call_get "Update Super Kino TV" "/api/super-kino/update"
            call_get "Update Quiniela Pale" "/api/quiniela-pale/update"
            if [[ "$dr_weekday" == "3" || "$dr_weekday" == "6" ]]; then call_get "Update Loto Mas" "/api/update"; fi
            call_get "Prepare Super Kino TV plays" "/api/super-kino/portfolio" 0
            call_get "Prepare Quiniela Pale plays" "/api/quiniela-pale/portfolio" 0
          elif [[ "$dr_hour" == "16" && "$dr_weekday" == "7" ]]; then
            call_get "Update Super Kino TV" "/api/super-kino/update"
            call_get "Update Quiniela Pale" "/api/quiniela-pale/update"
            call_get "Prepare Super Kino TV plays" "/api/super-kino/portfolio" 0
            call_get "Prepare Quiniela Pale plays" "/api/quiniela-pale/portfolio" 0
          else
            echo "No lottery operation is due in this Dominican-time window."
          fi

          if (( failures > 0 )); then
            echo "${failures} automatic operations failed. Successful products were still prepared."
            exit 1
          fi
