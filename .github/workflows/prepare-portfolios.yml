name: Prepare lottery portfolios

on:
  schedule:
    # Dominican time (UTC-4): 12 runs/day, independent of browser visits.
    - cron: "37 12 * * *" # 08:37: refresh and prepare all products
    - cron: "37 14 * * *" # 10:37: preparation retry and verification
    - cron: "17 16 * * *" # 12:17: Quinielon Dia, attempt 1
    - cron: "47 16 * * *" # 12:47: attempt 2
    - cron: "17 17 * * *" # 13:17: final attempt
    - cron: "37 21 * * *" # 17:37: prepare Quinielon Noche
    - cron: "17 23 * * *" # 19:17: Quinielon Noche, attempt 1
    - cron: "47 23 * * *" # 19:47: attempt 2
    - cron: "17 0 * * *"  # 20:17: final attempt (next UTC date)
    # Mon-Sat at 21:17 / 21:47 / 22:17 DR => Tue-Sun UTC.
    - cron: "17 1 * * 0,2-6"
    - cron: "47 1 * * 0,2-6"
    - cron: "17 2 * * 0,2-6"
    # Sunday Kino at 16:17 / 16:47 / 17:17 DR.
    - cron: "17 20 * * 0"
    - cron: "47 20 * * 0"
    - cron: "17 21 * * 0"
  workflow_dispatch:
    inputs:
      schedule:
        description: "Exact cron window to retry; after 3 hours, verify saved records only"
        required: true
        type: string
        default: "37 12 * * *"

permissions:
  contents: read

concurrency:
  group: prepare-lottery-portfolios
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Update and verify scheduled products
        env:
          APP_URL: ${{ vars.APP_URL || 'https://analisis-diario.vercel.app' }}
          AUTOMATION_SCHEDULE: ${{ github.event.schedule || inputs.schedule }}
        run: node --experimental-strip-types scripts/automate-portfolios.ts
